<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plant Tunes | Harmony of Nature & Sound</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            scroll-behavior: smooth;
        }
        .serif {
            font-family: 'Playfair Display', serif;
        }
        .glass {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .bg-botanical {
            background-color: #f8faf9;
            background-image: radial-gradient(#d1dbd4 0.5px, transparent 0.5px);
            background-size: 20px 20px;
        }
        .green-gradient {
            background: linear-gradient(135deg, #2d5a27 0%, #1a3c1a 100%);
        }
        .logo-img {
            height: 40px;
            width: auto;
            object-fit: contain;
        }
        .hero-bg-split {
            position: absolute;
            top: 0;
            left: 0;
            width: 60%;
            height: 100%;
            z-index: 0;
        }
        .hero-bg-split img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .hero-bg-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to right, rgba(248, 250, 249, 0.1) 0%, rgba(248, 250, 249, 0.8) 50%, rgba(248, 250, 249, 1) 100%);
            z-index: 1;
        }
        .hidden-page {
            display: none;
        }
        @media (max-width: 768px) {
            .hero-bg-split {
                width: 100%;
                opacity: 0.5;
            }
            .hero-bg-overlay {
                background: rgba(248, 250, 249, 0.7);
            }
        }
    </style>
</head>
